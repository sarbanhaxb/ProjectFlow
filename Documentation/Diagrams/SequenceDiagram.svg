<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1370" version="1.1" viewBox="0 0 1740 1370" width="1740" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="white" height="1370" width="1740" x="0" y="0" /><rect fill="#4F46E5" height="12" width="1740" x="0" y="0" /><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" x="80" y="65">PROJECTFLOW  /  ПРОЕКТИРОВАНИЕ ИС</text><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="start" x="80" y="114">Диаграмма последовательности: создание задачи</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" x="80" y="153">Взаимодействие пользователя, WPF, MVVM, сервисного слоя и MongoDB</text><rect fill="#EEF2FF" height="74" rx="12" ry="12" stroke="#4F46E5" stroke-width="1.5" width="252" x="4" y="202" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="130" y="233">Пользователь</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="130" y="259">Актор</text><line stroke="#CBD5E1" stroke-dasharray="7,7" stroke-width="1.8" x1="130" x2="130" y1="276" y2="1250" /><rect fill="#EEF2FF" height="74" rx="12" ry="12" stroke="#4F46E5" stroke-width="1.5" width="252" x="289" y="202" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="415" y="233">TasksView</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="415" y="259">WPF · View</text><line stroke="#CBD5E1" stroke-dasharray="7,7" stroke-width="1.8" x1="415" x2="415" y1="276" y2="1250" /><rect fill="#EEF2FF" height="74" rx="12" ry="12" stroke="#4F46E5" stroke-width="1.5" width="252" x="574" y="202" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="700" y="233">TasksViewModel</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="700" y="259">MVVM · управление</text><line stroke="#CBD5E1" stroke-dasharray="7,7" stroke-width="1.8" x1="700" x2="700" y1="276" y2="1250" /><rect fill="#EEF2FF" height="74" rx="12" ry="12" stroke="#4F46E5" stroke-width="1.5" width="252" x="859" y="202" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="985" y="233">TaskEditorWindow</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="985" y="259">WPF · диалог</text><line stroke="#CBD5E1" stroke-dasharray="7,7" stroke-width="1.8" x1="985" x2="985" y1="276" y2="1250" /><rect fill="#EEF2FF" height="74" rx="12" ry="12" stroke="#4F46E5" stroke-width="1.5" width="252" x="1144" y="202" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1270" y="233">TaskService</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="1270" y="259">Проверка и запись</text><line stroke="#CBD5E1" stroke-dasharray="7,7" stroke-width="1.8" x1="1270" x2="1270" y1="276" y2="1250" /><rect fill="#EEF2FF" height="74" rx="12" ry="12" stroke="#4F46E5" stroke-width="1.5" width="252" x="1429" y="202" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="1555" y="233">MongoDB</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="1555" y="259">ProjectFlowDB</text><line stroke="#CBD5E1" stroke-dasharray="7,7" stroke-width="1.8" x1="1555" x2="1555" y1="276" y2="1250" /><line stroke="#4F46E5" stroke-width="2.3" x1="130" x2="415" y1="320" y2="320" /><polygon fill="#4F46E5" points="415,320 403,314 403,326" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="272.5" y="306">Нажать «Добавить задачу»</text><line stroke="#4F46E5" stroke-width="2.3" x1="415" x2="700" y1="378" y2="378" /><polygon fill="#4F46E5" points="700,378 688,372 688,384" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="557.5" y="364">CreateTaskCommand</text><line stroke="#4F46E5" stroke-width="2.3" x1="700" x2="985" y1="436" y2="436" /><polygon fill="#4F46E5" points="985,436 973,430 973,442" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="842.5" y="422">new TaskEditorWindow(); ShowDialog()</text><rect fill="#F8FAFC" height="61" rx="8" ry="8" stroke="#CBD5E1" stroke-width="1" width="246" x="864" y="467" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="987" y="491">Загрузка списка проектов</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="987" y="512">и участников через сервисы</text><line stroke="#4F46E5" stroke-width="2.3" x1="130" x2="985" y1="558" y2="558" /><polygon fill="#4F46E5" points="985,558 973,552 973,564" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="557.5" y="544">Заполнить форму и нажать «Сохранить»</text><line stroke="#4F46E5" stroke-dasharray="8,6" stroke-width="2.3" x1="985" x2="700" y1="618" y2="618" /><polygon fill="#4F46E5" points="700,618 712,612 712,624" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="842.5" y="604">DialogResult = true; TaskItem</text><line stroke="#4F46E5" stroke-width="2.3" x1="700" x2="1270" y1="684" y2="684" /><polygon fill="#4F46E5" points="1270,684 1258,678 1258,690" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="985.0" y="670">CreateAsync(task)</text><line stroke="#4F46E5" stroke-width="2.3" x1="1270" x2="1555" y1="744" y2="744" /><polygon fill="#4F46E5" points="1555,744 1543,738 1543,750" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="1412.5" y="730">Проверить проект и исполнителя</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="1412.5" y="772">Find(projectId), Any(assigneeId)</text><line stroke="#4F46E5" stroke-dasharray="8,6" stroke-width="2.3" x1="1555" x2="1270" y1="808" y2="808" /><polygon fill="#4F46E5" points="1270,808 1282,802 1282,814" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="1412.5" y="794">Результаты проверок</text><rect fill="#EEF2FF" height="58" rx="8" ry="8" stroke="#A5B4FC" stroke-width="1" width="254" x="1145" y="828" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" x="1272" y="852">Проверка MemberIds</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="1272" y="872">исполнитель участвует в проекте</text><line stroke="#4F46E5" stroke-width="2.3" x1="1270" x2="1555" y1="934" y2="934" /><polygon fill="#4F46E5" points="1555,934 1543,928 1543,940" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="1412.5" y="920">InsertOneAsync(task)</text><line stroke="#4F46E5" stroke-dasharray="8,6" stroke-width="2.3" x1="1555" x2="1270" y1="1003" y2="1003" /><polygon fill="#4F46E5" points="1270,1003 1282,997 1282,1009" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="1412.5" y="989">Запись подтверждена</text><line stroke="#4F46E5" stroke-dasharray="8,6" stroke-width="2.3" x1="1270" x2="700" y1="1067" y2="1067" /><polygon fill="#4F46E5" points="700,1067 712,1061 712,1073" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="985.0" y="1053">CreateAsync завершён</text><line stroke="#4F46E5" stroke-width="2.3" x1="700" x2="415" y1="1130" y2="1130" /><polygon fill="#4F46E5" points="415,1130 427,1124 427,1136" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="557.5" y="1116">Обновить привязанные данные</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" x="557.5" y="1158">после ReloadTasksAsync() и запросов к MongoDB</text><line stroke="#4F46E5" stroke-dasharray="8,6" stroke-width="2.3" x1="415" x2="130" y1="1192" y2="1192" /><polygon fill="#4F46E5" points="130,1192 142,1186 142,1198" /><text fill="#4F46E5" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" x="272.5" y="1178">Показать задачу и сообщение</text><rect fill="#F8FAFC" height="70" rx="10" ry="10" stroke="#CBD5E1" stroke-width="1" width="1590" x="75" y="1271" /><text fill="#0F172A" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="start" x="105" y="1299">Альтернативные исходы:</text><text fill="#64748B" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" x="105" y="1325">Отмена диалога → запись не создаётся. Ошибка проверки → InvalidOperationException → сообщение в StatusMessage.</text></svg>